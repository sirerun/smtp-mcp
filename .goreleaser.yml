version: 2
project_name: smtp-mcp

builds:
  - id: smtp-mcp
    main: ./cmd/smtp-mcp
    binary: smtp-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  github:
    owner: sirerun
    name: smtp-mcp
  prerelease: auto
  make_latest: true
